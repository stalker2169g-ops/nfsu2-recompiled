name: Android font atlas repair checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-font-atlas-repair.yml'
      - 'android/fontrepaircheck/**'
      - 'android/app/src/main/java/com/nfsu2/androidevolved/FontTextureRepair.java'
      - 'android/gradle.properties'
concurrency:
  group: android-font-atlas-check
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android Canvas and file-repair instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            chmod +x android/gradlew
            android/gradlew -p android :fontrepaircheck:connectedDebugAndroidTest -PnfsPrebuiltNative --no-daemon --stacktrace --max-workers=2
            mkdir -p build/font-repair-check
            adb pull /sdcard/Android/data/com.nfsu2.fontrepaircheck/files/font-repair-preview.png build/font-repair-check/font-repair-preview.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-font-repair-tests
          path: |
            android/fontrepaircheck/build/reports/androidTests/connected/**
            android/fontrepaircheck/build/outputs/androidTest-results/connected/**
            build/font-repair-check/**
