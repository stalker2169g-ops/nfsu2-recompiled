name: Publish original language recovery APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-language-recovery.yml']
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Wait for recovery APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch 40326597243 --interval 10 --exit-status
          gh run download 40326597243 --name NFSU2-ARM64-Cyrillic-native-fix --dir build/input
      - name: Prepare recovery release
        run: |
          mkdir -p build/release
          find build/input -name app-debug.apk -exec cp {} build/release/NFSU2-ARM64-Restore-Original-Files.apk \;
          sha256sum build/release/NFSU2-ARM64-Restore-Original-Files.apk > build/release/SHA256SUMS.txt
      - name: Publish recovery APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create arm64-language-recovery-40326597243 build/release/* --prerelease --target "$GITHUB_SHA" --title "Recovery — restore original language files" --notes-file docs/LANGUAGE_RECOVERY.md
