
name: Legacy native source rebuild (owner input required)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generation tools
        run: python3 -m pip install capstone==5.0.6 pefile==2024.8.26 cryptography

      - name: Receive encrypted owner input
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/receive_build_input.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.30.5'

      - name: Check Russian codepage
        run: python3 scripts/check_cp1251.py

      - name: Prepare native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools
          git clone https://github.com/sp00nznet/pcrecomp.git ../pcrecomp
          git -C ../pcrecomp checkout 35548b8
          git -C ../pcrecomp -c user.name="Build" -c user.email="build@localhost" am "$GITHUB_WORKSPACE"/patches/pcrecomp/*.patch
          git clone https://github.com/Joshua-Ashton/dxvk-native.git build/dxvk-upstream
          git -C build/dxvk-upstream checkout c8dc91fabd00cac11d697ccf07426e798393cd40
          python3 ports/dxvk_android/prepare.py build/dxvk-upstream build/dxvk-source
          python3 ports/dxvk_android/shaders.py build/dxvk-source

      - name: Generate game C
        env:
          PYTHONUNBUFFERED: '1'
        run: python3 scripts/generate_android_guest.py

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -PnfsAbi=arm64-v8a --no-daemon --stacktrace --max-workers=2

      - uses: actions/upload-artifact@v4
        with:
          name: NFSU2-Russian-ARM64-test
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Remove ephemeral input branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/build-input-$GITHUB_RUN_ID"
