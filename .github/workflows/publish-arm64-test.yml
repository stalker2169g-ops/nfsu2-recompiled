name: Publish verified ARM64 Cyrillic fix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-arm64-test.yml']
permissions:
  actions: read
  contents: write
defaults:
  run:
    shell: bash
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the tested build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/40185877463 --jq .head_sha)" = e086538147f29b8f4137e9396b5892dd1c397387
          gh run watch 40185877463 --interval 10 --exit-status
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/40186370503 --jq .head_sha)" = dc5c52c8aa8e49fc738f0ba21cab517ea11d03ae
          test "$(gh api repos/$GITHUB_REPOSITORY/contents/android/app/src/main/java/com/nfsu2/androidevolved/FontTextureRepair.java?ref=e086538147f29b8f4137e9396b5892dd1c397387 --jq .sha)" = "$(gh api repos/$GITHUB_REPOSITORY/contents/android/app/src/main/java/com/nfsu2/androidevolved/FontTextureRepair.java?ref=dc5c52c8aa8e49fc738f0ba21cab517ea11d03ae --jq .sha)"
          gh run watch 40186370503 --interval 10 --exit-status
          gh run download 40186370503 --name Android-font-repair-tests --dir build/font-checks
          gh run download 40185877463 --name NFSU2-ARM64-Cyrillic-native-fix --dir build/cyrillic-result
      - name: Match APK, native hash and ARM64 test evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil,zipfile
          root=Path('build/cyrillic-result')
          def one(name):
              matches=list(root.rglob(name))
              assert len(matches)==1,(name,matches)
              return matches[0]
          apk=one('app-debug.apk')
          report=one('patch-report.json')
          log=one('verification.log')
          checksum=one('APK-SHA256.txt').read_text().split()[0]
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==checksum
          native_hash=json.loads(report.read_text())['output_sha256']
          with zipfile.ZipFile(apk) as z:
              assert hashlib.sha256(z.read('lib/arm64-v8a/libnfsu2_android.so')).hexdigest()==native_hash
          assert 'ARM64_CODEC_VERIFIED_SHA256='+native_hash in log.read_text()
          assert 'bias=0x1000000000' in log.read_text()
          tests=list(Path('build/font-checks').rglob('TEST-*.xml'))
          import xml.etree.ElementTree as ET
          suites=[ET.parse(t).getroot() for t in tests]
          assert suites and sum(int(s.get('tests','0')) for s in suites)>=6
          assert all(int(s.get('failures','0'))==0 and int(s.get('errors','0'))==0 for s in suites)
          out=Path('build/release');out.mkdir(parents=True,exist_ok=True)
          name='NFSU2-ARM64-Font-Repair-test.apk'
          shutil.copyfile(apk,out/name)
          shutil.copyfile(Path('docs/FONT_RESOURCE_REPAIR_REPORT.md'),out/'FONT_RESOURCE_REPAIR_REPORT.md')
          shutil.copyfile(report,out/'native-patch-report.json')
          shutil.copyfile(log,out/'ARM64-codec-verification.log')
          (out/'SHA256SUMS.txt').write_text(checksum+'  '+name+'\n')
          print('Published APK SHA256:',checksum)
          print('Published native SHA256:',native_hash)
          PY
      - name: Publish corrected test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create arm64-font-repair-40185877463 build/release/* --prerelease --target "$GITHUB_SHA" --title "ARM64 Russian font resource repair — test build" --notes-file docs/FONT_RESOURCE_REPAIR_REPORT.md
