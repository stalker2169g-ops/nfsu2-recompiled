name: Publish verified ARM64 test APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-arm64-test.yml']
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40142832311 --name NFSU2-ARM64-launcher-test-upstream-runtime --dir build/test-apk
          python3 - <<'PY'
          import hashlib, shutil
          from pathlib import Path
          files = list(Path('build/test-apk').rglob('app-debug.apk'))
          assert len(files) == 1, files
          assert hashlib.sha256(files[0].read_bytes()).hexdigest() == '94cdbdcb6ce083b2711267019d47e726ad8a49b853dea317754cf5a39e3d3ed9'
          shutil.copyfile(files[0], 'build/NFSU2-ARM64-launcher-test.apk')
          PY
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create arm64-launcher-test-40142832311 build/NFSU2-ARM64-launcher-test.apk --prerelease --target 182221982e2591124b68680d9c59888482a583e6 --title "ARM64 launcher test — upstream native runtime" --notes-file docs/ARM64_TEST_RELEASE.md
